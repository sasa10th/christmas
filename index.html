    <!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ASCII Christmas Tree</title>
<style>
:root{--bg:#070b0f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const COLS=84,TH=1.5,BR=0.5,CE=0.96,SE=0.276,LOOP=22,TAU=Math.PI*2;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=v=>1-Math.pow(1-v,3);
const hash=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};

function rnd(s){
  return()=>{
    s|=0;s=s+0x6D2B79F5|0;
    let t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
const R=rnd(11),cache=new Map();

function col(r,g,b,a=1){
  r=(r*a)|0;g=(g*a)|0;b=(b*a)|0;
  const k=((r>>3)<<16)|((g>>3)<<8)|(b>>3);
  let s=cache.get(k);
  if(!s){s=`rgb(${r>>3<<3},${g>>3<<3},${b>>3<<3})`;cache.set(k,s)}
  return s;
}

const env=y=>BR*(1-(y+0.02)/1.55)*0.9+0.03;

const tree=[],tips=[];
function addPt(y,x,z,na,s,n,trunk,bv=1){
  tree.push({y,x,z,cn:Math.cos(na),sn:Math.sin(na),s,n,trunk,bv,c:(R()*64)|0});
}
for(let k=0;k<=8;k++){
  const top=k===8,yb=top?1.28:0.12+k*0.155,hk=top?0.2:0.3-k*0.013;
  const Rk=top?0.08:BR*(1-yb/1.55)+0.03;
  const nb=top?5:Math.round(10+Rk*20);
  for(let j=0;j<nb;j++){
    const aj=(j+R()*0.6)/nb*TAU+k*0.9,L=Rk*(0.78+0.32*R()),h2=hk*(0.85+0.3*R());
    const bv=0.75+0.5*R(),cs=Math.cos(aj),sn=Math.sin(aj),np=top?40:Math.round(80+L*170);
    for(let m=0;m<np;m++){
      const s=Math.pow(R(),0.8),r=s*L,w=(R()*2-1)*(0.04+0.075*s);
      let y=yb+h2*Math.pow(1-s,1.3)-0.1*s*s+(R()-0.5)*0.05;
      if(s>0.8)y-=R()*0.05;
      addPt(Math.max(0.02,y),r*cs-w*sn,r*sn+w*cs,aj,s,R(),false,bv);
    }
    if(!top&&R()<0.85)tips.push({y:yb-0.07,x:L*0.93*cs,z:L*0.93*sn});
  }
  if(!top)for(let m=0;m<160;m++){
    const a=R()*TAU,r=R()*Rk*0.55;
    addPt(yb+R()*hk,r*Math.cos(a),r*Math.sin(a),a,0.08,R(),false);
  }
}
for(let m=0;m<800;m++){
  const a=R()*TAU,r=0.03+R()*0.03;
  addPt(R(),r*Math.cos(a),r*Math.sin(a),a,0.5,R(),true);
}

const gar=[],GN=1400;
for(let i=0;i<GN;i++){
  const q=i/GN,a=q*3.4*TAU;
  const y=0.2+(TH-0.62)*q-0.09*Math.sin(((a/(TAU/5))%1)*Math.PI);
  const r=(BR*(1-y/1.55)+0.03)*1.02+0.015;
  gar.push({y,x:r*Math.cos(a),z:r*Math.sin(a),cn:Math.cos(a),sn:Math.sin(a),i,q});
}

const LC=[[255,60,60],[255,200,60],[80,130,255],[255,120,220],[255,255,255]];
const lights=tips.sort(()=>R()-0.5).slice(0,170).sort((p,q)=>p.y-q.y).map(p=>({y:p.y,x:p.x,z:p.z,k:(R()*5)|0,p:R()*TAU}));

const G=[
  {x:-0.66,z:0.22,w:.28,h:.26,d:.28,c:[40,90,235],q:.3},
  {x:0.02,z:0.66,w:.32,h:.32,d:.28,c:[225,40,40],q:-.2},
  {x:0.64,z:0.18,w:.26,h:.24,d:.26,c:[235,235,240],rib:[225,40,40],q:.5},
  {x:-0.12,z:-0.7,w:.24,h:.22,d:.24,c:[40,165,85],q:.9},
  {x:0.4,z:0.62,w:.2,h:.18,d:.2,c:[240,190,50],q:-.6}
];
for(const g of G){
  g.p=[];
  for(let i=0;i<1100;i++){
    const f=Math.floor(R()*5),u=R()*2-1,v=R()*2-1;
    let lx,ly,lz,nx=0,ny=0,nz=0;
    if(f<4){
      ly=(v+1)/2*g.h;
      if(f===0){lx=u*g.w/2;lz=g.d/2;nz=1}
      else if(f===1){lx=u*g.w/2;lz=-g.d/2;nz=-1}
      else if(f===2){lz=u*g.d/2;lx=g.w/2;nx=1}
      else{lz=u*g.d/2;lx=-g.w/2;nx=-1}
    }else{
      ly=g.h;lx=u*g.w/2;lz=v*g.d/2;ny=1;
    }
    g.p.push({lx,ly,lz,nx,ny,nz,rib:Math.abs(u)<0.25||Math.abs(v)<0.25,c:(R()*4)|0});
  }
  for(let i=0;i<70;i++)g.p.push({lx:(R()-0.5)*0.2,ly:g.h+R()*0.07,lz:(R()-0.5)*0.2,nx:0,ny:1,nz:0,rib:true,c:(R()*4)|0});
}

const STAR=['     #     ','    ###    ','###########',' ######### ','  #######  ','  ##   ##  '];
const LOW='.:-xvo',HIGH='&%$#WM@8';

let W,H,dpr,rows,cw,chh,ox,cx,gR,S,rpu,zb,cb,cc,snow=[];

function resize(){
  dpr=window.devicePixelRatio||1;
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  const sw=Math.min(W,H*0.62);
  cw=sw/COLS;chh=cw*1.9;rows=Math.floor(H/chh);ox=(W-sw)/2;
  cx=COLS/2;gR=Math.round(rows*0.78);S=COLS*0.62;rpu=S/1.9;
  zb=new Float32Array(COLS*rows);
  cb=new Array(COLS*rows);
  cc=new Array(COLS*rows);
  snow=Array.from({length:230},()=>({x:R()*COLS,y:R()*rows,z:R()*3-1.5,s:.7+R()*1.8,p:R()*TAU}));
}
addEventListener('resize',resize);
resize();

function put(ix,iy,z,ch,c){
  if(ix<0||ix>=COLS||iy<0||iy>=rows)return;
  const i=iy*COLS+ix;
  if(z>=zb[i]){zb[i]=z;cb[i]=ch;cc[i]=c}
}

function plot(x,y,z,ch,c){
  const f=1/(1-z*0.12);
  put(Math.round(cx+x*S*f),Math.round(gR-(y*CE-z*SE)*rpu*f),z,ch,c);
}

const t0=performance.now();
let last=t0;

function frame(now){
  const t=((now-t0)/1000)%LOOP,dt=Math.min(0.05,(now-last)/1000);
  last=now;
  zb.fill(-9);cb.fill('');

  const th=0.3+t*0.55,ct=Math.cos(th),st=Math.sin(th);
  const fade=t>20?clamp((22-t)/2):1;
  const gp=ease(seg(t,2.2,10.5)),gy=gp*TH,growing=gp<0.999;
  const LX=-0.35,LY=0.35,LZ=0.8;

  const g0=ease(seg(t,0.8,2.6)),reach=g0*COLS*0.62;
  for(let r=gR-5;r<rows;r++)for(let x=0;x<COLS;x++){
    const dx=Math.abs(x-cx),k=hash(x,r);
    if(r<gR){
      const m=5*(1-(dx/reach)**2);
      if(dx<reach&&gR-r<=m&&k<0.8)put(x,r,-3,'.:*'[(k*3.7|0)%3],col(215,228,235,0.55+0.4*k));
    }else if(dx<=reach*1.25&&k<0.9-(r-gR)*0.02){
      const ch=(r&1)?'-.=':'.:,';
      put(x,r,-3,ch[(k*3.3|0)%3],col(125,136,145,Math.max(0.25,0.95-(r-gR)*0.018)));
    }
  }

  if(g0>0.2)for(const p of tree){
    if(p.y>gy)continue;
    const x=p.x*ct-p.z*st,z=p.x*st+p.z*ct;
    const nx=p.cn*ct-p.sn*st,nz=p.cn*st+p.sn*ct;
    const lam=clamp(nx*LX+0.45*LY+nz*LZ);
    const b=clamp((0.15+0.5*lam+0.55*Math.pow(p.s,0.8))*p.bv+(p.n-0.5)*0.2);
    let c;
    if(p.trunk)c=col((95+50*b)*fade,(58+30*b)*fade,(30+20*b)*fade);
    else if(growing&&gy-p.y<0.06)c=col(225,240,225,(1-(gy-p.y)/0.06)*0.7+0.3);
    else c=col((20+p.n*35+40*b)*fade,(55+170*b)*fade,(38+55*b)*fade);
    plot(x,p.y,z,p.trunk?'#|'[p.c&1]:b<0.42?LOW[p.c%6]:HIGH[p.c%8],c);
  }

  const gq=ease(seg(t,10,14));
  for(const p of gar){
    if(p.q>=gq)continue;
    const x=p.x*ct-p.z*st,z=p.x*st+p.z*ct;
    const vis=clamp((z+0.05)/0.3);
    if(vis<0.03)continue;
    const nx=p.cn*ct-p.sn*st,nz=p.cn*st+p.sn*ct;
    const b=0.6+0.4*clamp(nx*LX+0.3+nz*LZ);
    const hot=gq<1&&gq-p.q<0.03;
    const tw=0.5+0.5*Math.sin(now/240-p.i*0.4);
    const w=hot?1:tw*tw;
    const c=col(255*fade,(190+65*w)*fade,(55+190*w*w)*fade,(0.8+0.2*b)*(0.8+0.2*tw)*vis);
    plot(x,p.y,z+0.12,w>0.8?'@':w>0.4?'#':'*',c);
  }

  const nl=Math.floor(seg(t,13,16)*lights.length);
  for(let i=0;i<nl;i++){
    const p=lights[i];
    if(p.y>gy-0.03)continue;
    const x=p.x*ct-p.z*st,z=p.x*st+p.z*ct;
    const bl=0.55+0.45*Math.sin(now/330+p.p),c=LC[p.k];
    plot(x,p.y,z+0.08,bl>0.7?'O':'o',col(c[0]*fade,c[1]*fade,c[2]*fade,0.45+0.55*bl));
  }

  const gs=ease(seg(t,11.5,13.5));
  if(gs>0.02)for(const g of G){
    const cq=Math.cos(g.q),sq=Math.sin(g.q);
    for(const p of g.p){
      const sx=g.x+p.lx*cq-p.lz*sq,sz=g.z+p.lx*sq+p.lz*cq;
      const x=sx*ct-sz*st,z=sx*st+sz*ct;
      const nx0=p.nx*cq-p.nz*sq,nz0=p.nx*sq+p.nz*cq;
      const nx=nx0*ct-nz0*st,nz=nx0*st+nz0*ct;
      const b=0.55+0.45*clamp(nx*LX+p.ny*LY+nz*LZ);
      const c2=p.rib?(g.rib||[245,245,245]):g.c;
      plot(x,p.ly*gs,z,p.rib?'X+'[p.c&1]:'#%&@'[p.c],col(c2[0]*b*fade,c2[1]*b*fade,c2[2]*b*fade));
    }
  }

  const sp=ease(seg(t,15,16.3));
  if(sp>0.02){
    const tipR=Math.round(gR-TH*CE*rpu)+1,bl=0.8+0.2*Math.sin(now/240),shownR=Math.ceil(STAR.length*sp);
    for(let j=0;j<STAR.length;j++)for(let i=0;i<11;i++){
      if(STAR[j][i]===' '||j>=shownR)continue;
      const k=hash(i,j),tw=0.8+0.2*Math.sin(now/200+k*9);
      put(Math.round(cx)-5+i,tipR-STAR.length+j,8,'#*@'[(k*3)|0],
        col(255*fade,(205+50*k)*bl*fade,(60+150*k*tw)*bl*fade));
    }
  }

  for(const s of snow){
    s.y+=s.s*dt*3.6;
    s.x+=Math.sin(now/1100+s.p)*dt*1.1+dt*0.4;
    if(s.y>rows){s.y=-1;s.x=R()*COLS}
    if(s.x>COLS)s.x-=COLS;
    const near=(s.z+1.5)/3;
    put(Math.round(s.x),Math.round(s.y),s.z,near>0.7?'*':near>0.35?'+':'.',col(205,225,238,0.3+0.5*near));
  }

  const msg=[...'MERRY CHRISTMAS'].join(' '),tp=seg(t,16.3,19);
  const tr=Math.min(rows-2,gR+9),sx0=Math.round(cx-msg.length/2);
  const pal=[[230,50,50],[240,195,60],[50,170,90]];
  for(let i=0;i<msg.length;i++){
    if(i/msg.length>=tp)break;
    if(msg[i]!==' '){const c=pal[(i>>1)%3];put(sx0+i,tr,9,msg[i],col(c[0],c[1],c[2],fade))}
  }

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#070b0f';
  ctx.fillRect(0,0,W,H);
  ctx.font=`${cw*1.62}px ui-monospace,Menlo,Consolas,monospace`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  let lastC='';
  for(let i=0;i<cb.length;i++){
    const ch=cb[i];
    if(!ch)continue;
    if(cc[i]!==lastC){ctx.fillStyle=cc[i];lastC=cc[i]}
    ctx.fillText(ch,ox+((i%COLS)+0.5)*cw,(((i/COLS)|0)+0.5)*chh);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
